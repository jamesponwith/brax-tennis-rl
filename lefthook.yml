# Build inner-loop gate. Must stay under 10s total or it will get skipped — speed is a feature.
# Hooks no-op until uv is installed: https://docs.astral.sh/uv/
pre-commit:
  parallel: true
  commands:
    # No beads step here. It deadlocked under lefthook's parallel execution —
    # fine alone, hangs past 110s alongside the other commands — and after ADR
    # 0011 untracked the JSONL export it had nothing left to contribute to a
    # commit anyway. beads' own hooks remain available via core.hooksPath for
    # anyone who wants them; the Build gate simply does not chain them (ADR 0012).
    format:
      run: command -v uv >/dev/null || exit 0; uv run ruff format --check .
    lint:
      run: command -v uv >/dev/null || exit 0; uv run ruff check .
    test:
      run: command -v uv >/dev/null || exit 0; uv run pytest -m "not slow"

# Validate assistant: local AI review before code leaves the machine — no CI minutes, no secrets.
# ponytail: advisory (never blocks the push); flip to blocking if findings start getting ignored.
# No AI review here (ADR 0013): an eight-minute agent task on a synchronous git
# operation gets bypassed. Review runs inside /flywheel-next instead.
