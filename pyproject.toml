[project]
name = "brax-tennis-rl"
version = "0.0.0"
description = "PPO agent in Brax/JAX learning to intercept and return a tennis ball"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
