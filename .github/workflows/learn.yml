# Learn: weekly DORA-lite snapshot committed back to the repo. Reuses the Go
# collector from flywheel-template via `go run` — one canonical copy, no port.
name: learn

on:
  schedule:
    - cron: "0 6 * * 1" # monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run github.com/jamesponwith/flywheel-template/tools/dora@latest -repo "$GITHUB_REPOSITORY" -out docs/dora.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/dora.json
          if ! git diff --cached --quiet; then
            git commit -m "learn: weekly DORA snapshot"
            git push
          fi
